[package]
name = "Anti-Power"
version = "5.3.0"
description = "Local session manager for the Antigravity App and Antigravity CLI"
license = "GPL-3.0-only"
repository = "https://github.com/mikessslxxx/anti-power"
edition = "2021"
rust-version = "1.95"

[lib]
# Windows needs a lib name that differs from the bin name, see https://github.com/rust-lang/cargo/issues/8519
name = "anti_power_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
semver = "1"
regex = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rusqlite = { version = "0.43", features = ["bundled"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
zip = { version = "6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
